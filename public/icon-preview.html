<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
</head>
<body style="background:#1a1a2e;display:flex;align-items:center;justify-content:center;height:100vh;margin:0">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="512" height="512">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');</style>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d0d0dc"/>
      <stop offset="50%" stop-color="#c4c4d0"/>
      <stop offset="100%" stop-color="#b8b8c8"/>
    </linearGradient>
    <linearGradient id="lcd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8bc94"/>
      <stop offset="100%" stop-color="#8fa87a"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a52"/>
      <stop offset="100%" stop-color="#252538"/>
    </linearGradient>
    <clipPath id="iconClip">
      <rect width="1024" height="1024" rx="168"/>
    </clipPath>
  </defs>

  <g clip-path="url(#iconClip)">
    <!-- 기기 바디 -->
    <rect x="0" y="0" width="1024" height="1400" fill="url(#body)"/>
    <!-- 상단 광택 -->
    <rect x="0" y="0" width="1024" height="380" fill="white" opacity="0.13"/>

    <!-- ── 상단 브랜드 바 ── -->
    <!-- 빨간 LED -->
    <circle cx="80" cy="88" r="16" fill="#ef4444" opacity="0.9"/>
    <circle cx="80" cy="87" r="9" fill="#ff7070" opacity="0.55"/>
    <!-- VOCABOY 텍스트 -->
    <text x="108" y="104"
          font-family="'VT323', monospace"
          font-size="56" font-weight="bold"
          fill="#5a5a7a" letter-spacing="10">VOCABOY</text>
    <!-- 초록 LED (텍스트 바로 오른쪽) -->
    <circle cx="464" cy="88" r="16" fill="#34d399" opacity="0.9"/>
    <circle cx="464" cy="87" r="9" fill="#6ee7b7" opacity="0.55"/>

    <!-- 배터리 (오른쪽 정렬) -->
    <text x="588" y="103"
          font-family="'VT323', monospace"
          font-size="44" fill="#6a6a8a" letter-spacing="4">BATT</text>
    <!-- 배터리 외곽 -->
    <rect x="672" y="68" width="72" height="36" rx="7"
          fill="none" stroke="#6a6a8a" stroke-width="3.5"/>
    <!-- 배터리 채워진 부분 -->
    <rect x="676" y="72" width="60" height="28" rx="4" fill="#34d399" opacity="0.85"/>
    <!-- 배터리 단자 -->
    <rect x="744" y="77" width="10" height="18" rx="3" fill="#6a6a8a"/>

    <!-- ── LCD 베젤 ── -->
    <rect x="104" y="148" width="816" height="786" rx="28" fill="url(#bezel)"/>
    <!-- 베젤 상단 하이라이트 -->
    <rect x="104" y="148" width="816" height="3" rx="2" fill="white" opacity="0.07"/>

    <!-- ── LCD 화면 ── -->
    <rect x="124" y="168" width="776" height="748" rx="18" fill="url(#lcd)"/>

    <!-- ── VOCABOY 부팅 텍스트 ── -->
    <text x="512" y="620"
          font-family="'VT323', monospace"
          font-size="148" font-weight="bold"
          text-anchor="middle" dominant-baseline="middle"
          fill="#2d3319" opacity="0.88" letter-spacing="14">VOCABOY</text>

  </g>

  <!-- 아이콘 외곽선 -->
  <rect x="1" y="1" width="1022" height="1022" rx="168"
        fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="2"/>
</svg>
</body>
</html>
